<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/driven">Template</ion-button>
      <ion-button (click)="toggleDarkMode()">
        {{ darkMode() ? '☀️ Claro' : '🌙 Oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor">
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <ion-list lines="full">
        <ion-item>
          <ion-input
            label="Nombre completo"
            labelPlacement="floating"
            type="text"
            formControlName="nombre"
            errorText="El nombre es obligatorio (mín. 3 caracteres).">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Correo Electrónico"
            labelPlacement="floating"
            type="email"
            inputmode="email"
            formControlName="email"
            errorText="Introduzca un email válido.">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Fecha de nacimiento"
            labelPlacement="stacked"
            type="date"
            formControlName="fechaNacimiento"
            [max]="hoy"
            [errorText]="errorFecha">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            type="password"
            formControlName="password"
            errorText="Mínimo 8 caracteres, letras y números.">
          </ion-input>
        </ion-item>
      </ion-list>

      <div class="ion-padding-top">
        <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
          <span *ngIf="!isSubmitting()">Registrarse</span>
          <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
        </ion-button>

        <ion-button
          expand="block"
          fill="outline"
          type="button"
          *ngIf="ultimoEnvio()"
          (click)="descargarPdf()">
          Descargar PDF del último envío
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
